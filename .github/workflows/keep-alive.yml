name: Keep playground alive

on:
  schedule:
    - cron: '13,28,43,58 * * * *'
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe playground (main domain first)
        id: probe
        run: |
          set -uo pipefail
          
          # URLs to check in order of preference
          MAIN_URL="https://laya-playground-jvrv57wjrcpp57.github.dev"
          PORT_URL="https://laya-playground-jvrv57wjrcpp57-8000.app.github.dev"
          
          alive=false
          visibility="unknown"
          final_url=""
          
          # Try main domain first
          echo "Mencoba domain utama: $MAIN_URL"
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$MAIN_URL/health" || echo 000)
          echo "Main domain http=$code"
          
          if [ "$code" = "200" ] || [ "$code" = "302" ]; then
            alive=true
            final_url="$MAIN_URL"
            case "$code" in
              200) visibility="public" ;;
              302) visibility="private" ;;
            esac
          else
            # Fallback to port 8000 domain
            echo "Domain utama gagal, mencoba port 8000: $PORT_URL"
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$PORT_URL/health" || echo 000)
            echo "Port 8000 http=$code"
            
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              alive=true
              final_url="$PORT_URL"
              case "$code" in
                200) visibility="public" ;;
                302) visibility="private" ;;
              esac
            fi
          fi
          
          echo "alive=$alive" >> "$GITHUB_OUTPUT"
          echo "visibility=$visibility" >> "$GITHUB_OUTPUT"
          echo "final_url=$final_url" >> "$GITHUB_OUTPUT"
          
          if [ "$alive" = "true" ]; then
            echo "Playground hidup di: $final_url"
          else
            echo "Playground mati"
          fi

      - name: Try make port public (best effort)
        if: steps.probe.outputs.alive == 'true' && steps.probe.outputs.visibility == 'private'
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "Mencoba ubah port 8000 ke public via gh CLI..."
          if gh codespace ports visibility -c "$CODESPACE_NAME" 8000:public 2>&1; then
            echo "Berhasil ubah port ke public"
          else
            echo "Gagal ubah port (cek PAT scope 'codespace' di secret GH_PAT_CODESPACE)"
            echo "Jalankan manual: gh codespace ports visibility -c $CODESPACE_NAME 8000:public"
          fi
        env:
          CODESPACE_NAME: ${{ vars.CODESPACE_NAME }}
          GH_TOKEN: ${{ secrets.GH_PAT_CODESPACE }}

      - name: Report private port
        if: steps.probe.outputs.alive == 'true' && steps.probe.outputs.visibility == 'private'
        run: |
          set -uo pipefail
          echo "codespace hidup, port 8000 private."
          echo "PERUBAHAN GITHUB: port private sekarang butuh login + akses codespace (bukan warning page)."
          echo "Domain utama (public) tetap bisa diakses anon: https://laya-playground-jvrv57wjrcpp57.github.dev"
          echo "Auto-fix dicoba di step 'Try make port public' via secret GH_PAT_CODESPACE."
        env:
          CODESPACE_NAME: ${{ vars.CODESPACE_NAME }}

      - name: Start codespace
        if: steps.probe.outputs.alive == 'false'
        run: |
          set -uo pipefail
          echo "playground mati, menyalakan codespace $CODESPACE_NAME"
          gh api -X POST "user/codespaces/$CODESPACE_NAME/start" --jq '.state' \
            || echo "start gagal, cek nama codespace"
        env:
          CODESPACE_NAME: ${{ vars.CODESPACE_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for health
        if: steps.probe.outputs.alive == 'false'
        run: |
          set -uo pipefail
          
          MAIN_URL="https://laya-playground-jvrv57wjrcpp57.github.dev"
          PORT_URL="https://laya-playground-jvrv57wjrcpp57-8000.app.github.dev"
          
          for i in $(seq 1 18); do
            sleep 20
            
            # Check both URLs
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "$MAIN_URL/health" || echo 000)
            echo "percobaan $i (main): http=$code"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "sudah hidup (main domain) setelah $((i * 20)) detik"
              exit 0
            fi
            
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "$PORT_URL/health" || echo 000)
            echo "percobaan $i (port 8000): http=$code"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "sudah hidup (port 8000) setelah $((i * 20)) detik"
              exit 0
            fi
          done
          echo "masih mati setelah 6 menit" >&2
          echo "port visibility tidak bisa diubah dari Actions." >&2
          echo "perbaiki manual: gh codespace ports visibility -c $CODESPACE_NAME 8000:public" >&2
          exit 1
        env:
          CODESPACE_NAME: ${{ vars.CODESPACE_NAME }}

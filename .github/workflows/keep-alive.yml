name: Keep playground alive

on:
  schedule:
    - cron: '13,28,43,58 * * * *'
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe playground
        id: probe
        run: |
          set -uo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$PLAYGROUND_URL/health" || echo 000)
          echo "http=$code"
          case "$code" in
            200)
              echo "alive=true" >> "$GITHUB_OUTPUT"
              echo "visibility=public" >> "$GITHUB_OUTPUT"
              ;;
            302)
              echo "alive=true" >> "$GITHUB_OUTPUT"
              echo "visibility=private" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "alive=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
        env:
          PLAYGROUND_URL: ${{ vars.PLAYGROUND_URL }}

      - name: Report private port
        if: steps.probe.outputs.alive == 'true' && steps.probe.outputs.visibility == 'private'
        run: |
          set -uo pipefail
          echo "codespace hidup, port 8000 private."
          echo "pengunjung anonim tetap bisa masuk lewat halaman peringatan sekali klik."
          echo "mengubah ke public: gh codespace ports visibility -c $CODESPACE_NAME 8000:public"
        env:
          CODESPACE_NAME: ${{ vars.CODESPACE_NAME }}

      - name: Start codespace
        if: steps.probe.outputs.alive == 'false'
        run: |
          set -uo pipefail
          echo "playground mati, menyalakan codespace $CODESPACE_NAME"
          gh api -X POST "user/codespaces/$CODESPACE_NAME/start" --jq '.state' \
            || echo "start gagal, cek nama codespace"
        env:
          CODESPACE_NAME: ${{ vars.CODESPACE_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for health
        if: steps.probe.outputs.alive == 'false'
        run: |
          set -uo pipefail
          for i in $(seq 1 18); do
            sleep 20
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "$PLAYGROUND_URL/health" || echo 000)
            echo "percobaan $i: http=$code"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "sudah hidup setelah $((i * 20)) detik"
              exit 0
            fi
          done
          echo "masih mati setelah 6 menit" >&2
          echo "port visibility tidak bisa diubah dari Actions." >&2
          echo "perbaiki manual: gh codespace ports visibility -c $CODESPACE_NAME 8000:public" >&2
          exit 1
        env:
          PLAYGROUND_URL: ${{ vars.PLAYGROUND_URL }}
          CODESPACE_NAME: ${{ vars.CODESPACE_NAME }}

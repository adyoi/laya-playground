name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Konsistensi tema HTML
        run: python lint_docs.py

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -r requirements-test.txt
      - name: Unit test
        run: python unit_test.py
